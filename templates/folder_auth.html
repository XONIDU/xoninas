<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>XONINAS · Acceso a carpeta</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #000;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #0f0;
        }
        .card {
            background: #111;
            border: 1px solid #6f2da8;
            border-radius: 32px;
            padding: 2rem;
            width: 360px;
            text-align: center;
        }
        h2 { color: #6f2da8; margin-bottom: 1rem; }
        input {
            width: 100%;
            padding: 12px;
            margin: 1rem 0;
            background: #222;
            border: 1px solid #6f2da8;
            border-radius: 60px;
            color: #0f0;
        }
        button {
            background: #6f2da8;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .error { color: #f55; margin-top: 0.8rem; }
        a { color: #aaa; display: block; margin-top: 1rem; }
    </style>
</head>
<body>
<div class="card">
    <h2>🔒 Carpeta protegida</h2>
    <p>Ingresa la contraseña para <strong>{{ folder_name }}</strong></p>
    <form method="POST">
        <input type="password" name="folder_password" placeholder="Contraseña" autofocus required>
        <button type="submit">Acceder</button>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
    <a href="/">← Volver al inicio</a>
</div>
</body>
</html>
