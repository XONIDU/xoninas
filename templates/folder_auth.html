<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XONINAS · Carpeta protegida</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #0a0f0a, #000000);
            font-family: 'Segoe UI', system-ui;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .lock-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            border: 1px solid #6f2da8;
            padding: 2.2rem;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
        }

        .lock-icon {
            font-size: 4rem;
            filter: drop-shadow(0 0 6px #6f2da8);
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.8rem;
            color: #c084fc;
            margin-bottom: 0.5rem;
        }

        .folder-name-highlight {
            background: #111511;
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 2rem;
            font-family: monospace;
            font-size: 1.1rem;
            margin: 0.8rem 0;
            border: 1px solid #2a6a2a;
        }

        .input-pwd {
            width: 100%;
            padding: 0.9rem 1rem;
            background: #0c100c;
            border: 1px solid #2a2f2a;
            border-radius: 3rem;
            color: #e0ffe0;
            font-size: 1rem;
            margin: 1rem 0;
            outline: none;
        }

        .input-pwd:focus {
            border-color: #6f2da8;
            box-shadow: 0 0 0 2px rgba(111, 45, 168, 0.3);
        }

        button {
            background: linear-gradient(95deg, #6f2da8, #8b3dd1);
            border: none;
            width: 100%;
            padding: 0.8rem;
            border-radius: 3rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #8235c4, #9b4fdf);
        }

        .error {
            background: rgba(200, 60, 60, 0.2);
            border-radius: 2rem;
            padding: 0.6rem;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #ffaaaa;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #6f8f6f;
            text-decoration: none;
            font-size: 0.8rem;
        }

        .back-link:hover {
            color: #00ff88;
        }
    </style>
</head>
<body>
<div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2>Acceso restringido</h2>
    <p>Esta carpeta está protegida</p>
    <div class="folder-name-highlight">{{ folder_name }}</div>
    <form method="POST">
        <input type="password" name="folder_password" class="input-pwd" placeholder="Contraseña de la carpeta" autofocus required>
        <button type="submit">✦ DESBLOQUEAR ✦</button>
        {% if error %}
        <div class="error">❌ {{ error }}</div>
        {% endif %}
    </form>
    <a href="/" class="back-link">← Volver al panel principal</a>
</div>
</body>
</html>
