{% extends "base.html" %}
{% block title %}Carpeta protegida{% endblock %}
{% block content %}
<div class="narrow" style="margin:30px auto 0; max-width:440px">
  <div class="card">
    <h1 style="font-size:1.3rem">Carpeta protegida</h1>
    <p class="muted" style="margin:4px 0 16px">Escribe la clave de <strong class="mono">{{ folder_name }}</strong> para abrirla.</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field"><label for="fp">Clave de la carpeta</label>
        <input id="fp" type="password" name="folder_password" autofocus required></div>
      {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
      <div class="actions">
        <button class="btn btn-primary" type="submit">Desbloquear</button>
        <a class="btn" href="{{ url_for('index') }}">Volver</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
