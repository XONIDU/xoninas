{% extends "base.html" %}
{% block title %}Acceso{% endblock %}
{% block nav %}{% endblock %}
{% block body %}
{% from "_macros.html" import theme_btn %}
<div class="corner">{{ theme_btn() }}</div>
<div class="center-page"><div class="panel">
  <div class="auth-head">
    <a class="brand" href="/"><i class="brand-mark"></i><span>XONINAS</span></a>
    <p class="muted">Inicia sesión para entrar a tu NAS local</p>
  </div>
  <form method="post" class="card">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field"><label for="u">Usuario</label>
      <input id="u" type="text" name="username" autocomplete="username" autofocus required></div>
    <div class="field"><label for="p">Clave</label>
      <input id="p" type="password" name="password" autocomplete="current-password" required></div>
    {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
  </form>
</div></div>
{% endblock %}
