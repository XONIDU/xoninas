<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XONINAS · Acceso</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 30%, #0a0a0a, #000000);
            font-family: 'Segoe UI', system-ui, monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f0;
        }
        .card {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            border: 1px solid #6f2da8;
            border-radius: 32px;
            padding: 2.5rem;
            width: 380px;
            box-shadow: 0 0 30px rgba(111,45,168,0.3);
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #6f2da8, #00ff88);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 1rem 0;
            background: #111;
            border: 1px solid #6f2da8;
            border-radius: 60px;
            color: #00ff88;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6f2da8;
            border: none;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #8a4bcb;
            transform: scale(1.02);
            box-shadow: 0 0 12px #6f2da8;
        }
        .error {
            color: #ff5555;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #555;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">📀</div>
    <h1>XONINAS</h1>
    <p style="margin-bottom: 1rem;">NAS local · Almacenamiento seguro</p>
    <form method="POST">
        <input type="password" name="master_password" placeholder="Clave maestra" autofocus required>
        <button type="submit">🔓 Acceder</button>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
    <div class="footer">XONIDU · open source storage</div>
</div>
</body>
</html>
